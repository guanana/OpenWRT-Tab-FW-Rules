name: Build OpenWrt Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPK Package
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Building version $VERSION from tag"
            bash build-ipk.sh "$VERSION"
          else
            echo "Building with default version"
            bash build-ipk.sh
          fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-firewall-tabs-ipk
          path: luci-app-firewall-tabs_*.ipk
